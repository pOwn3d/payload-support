# pnpm 11 requires package build scripts to be opted into explicitly. Without
# this file `pnpm install --frozen-lockfile` exits 1 with ERR_PNPM_IGNORED_BUILDS,
# which fails both ci.yml and publish.yml on their very first step.
# Note: the key is `allowBuilds`; `onlyBuiltDependencies` is the pnpm 10 spelling
# and is silently ineffective here.

packages:
  - '.'

allowBuilds:
  # tsup, vitest and Playwright all pull esbuild; its postinstall links the
  # platform binary. Several majors coexist in the tree, hence the bare name.
  esbuild: true
  # Transitive optional of payload (image processing). Never invoked by this
  # package's build or tests, and it ships prebuilt binaries anyway.
  sharp: false
  # Transitive optional used for file watching in dev only.
  '@parcel/watcher': false
