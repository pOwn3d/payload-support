name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A `limit=0` query param in a Payload REST URL does NOT mean "return no
      # document": the find operation disables pagination, skips the count query and
      # derives totalDocs from the rows it just materialised - i.e. a full table read
      # to display a counter. Use /api/<collection>/count instead.
      - name: Guard - no limit=0 in REST URLs
        run: |
          if grep -rnE '[?&]limit=0' --include='*.ts' --include='*.tsx' src/; then
            echo '::error::limit=0 found in a REST URL - use /api/<collection>/count instead'
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
